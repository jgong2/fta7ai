<title>AS · Auditing Secretary / 审核秘书 — DRAFT prototype rev03</title>
<style>
:root{
  --bg:#000;--g1:#1c1c1c;--g2:#2c2c2c;--g3:#3a3a3a;--sep:#383838;
  --lab:#f2f2f2;--lab2:#a1a1a1;--lab3:#6e6e6e;
  /* PALETTE: neutrals (black/white/greys) + orange + green; red ONLY for recording state (+ press-feedback on delete) */
  --or:#ff8a3d;--or-t:rgba(255,138,61,.16);
  --gr:#34d399;--gr-t:rgba(52,211,153,.16);
  --rd:#ff453a;--rd-t:rgba(255,69,58,.16);
  --blur:saturate(180%) blur(22px);
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#000}
html,body{margin:0;background:#000;color:var(--lab);font:17px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body{max-width:720px;margin:0 auto;padding-bottom:calc(var(--sab) + 24px);overflow-x:hidden}
body.incap{padding-bottom:calc(var(--sab) + 112px)}
a{color:var(--or);text-decoration:none}
.zh{color:var(--lab2);font-size:.88em;font-weight:400}
.ic{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.14em}
button,input,select,textarea{font-family:inherit}

/* ---- bars ---- */
.back{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  background:rgba(0,0,0,.72);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-bottom:.5px solid rgba(84,84,84,.55);padding:calc(var(--sat) + 2px) 8px 2px 8px;min-height:calc(var(--sat) + 48px)}
body.incase .back{display:none}
.back a{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px;font-size:17px;color:var(--or)}
.back a .ic{width:22px;height:22px}

  return tx(['cases','items','blobs','entries'],'readwrite',function(cs,is,bs,es){
    cs.delete(id);
    [is,bs,es].forEach(function(st){
      var rq=st.index('caseId').openKeyCursor(IDBKeyRange.only(id));
      rq.onsuccess=function(){var cu=rq.result;if(cu){st.delete(cu.primaryKey);cu.continue()}};
    });
  });
}
function loadAll(){
  return tx(['cases','items','entries','meta','sync'],'readonly',function(cs,is,es,ms,ss){return[cs.getAll(),is.getAll(),es.getAll(),ms.getAll(),ss.getAll()]}).then(function(rs){
    var cases=rs[0].result||[],items=rs[1].result||[],ents=rs[2].result||[],metas=rs[3].result||[];
    (rs[4].result||[]).forEach(function(t){TOMB[t.k]=t});
    metas.forEach(function(m){S[m.k]=m.v});
    var map={};cases.forEach(function(c){c.items={};c.entries=[];map[c.id]=c;
      if(!c.capState)c.capState='finished';else if(c.capState==='active')c.capState='held';   // a reload cannot keep a live capture running
      c.capMs=c.capMs||0});
    items.forEach(function(it){if(map[it.caseId])map[it.caseId].items[it.itemId]=it});
    ents.forEach(function(e){if(map[e.caseId])map[e.caseId].entries.push(e)});
    cases.forEach(sortEntries);
    cases.sort(function(a,b){return (a.created||'')<(b.created||'')?-1:1});
    db.cases=cases;
  });
}

/* ---------- migration: rev01 (localStorage) and rev02 (per-item notes/photos/audio) -> timeline entries ---------- */
function convertLegacy(c){
  var changed=false;
  Object.keys(c.items).forEach(function(k){
    var it=c.items[k],ph=it.photos||[],au=it.audios||[],has=ph.length||au.length||it.note||it.status;
    if(!has)return;
    changed=true;
    var base=(ph[0]&&ph[0].ts)||(au[0]&&au[0].ts)||c.created||new Date().toISOString(),made=0;
    function mk(kind,o){var e={id:o.id||'b'+uid(),caseId:c.id,n:0,kind:kind,ts:o.ts||base,text:o.text||'',note:'',via:o.via||'',mime:o.mime||'',size:o.size||0,w:o.w,h:o.h,dur:o.dur,tag:k,status:it.status||'',clause:'8.4'};c.entries.push(e);made++}
    ph.forEach(function(m){mk('photo',m)});
    au.forEach(function(m){mk('audio',m)});
    if(it.note)mk('text',{text:it.note,via:'typed'});
    if(!made)mk('text',{text:'(status carried over from an earlier revision 沿用旧版状态)',via:'typed'});
    it.photos=[];it.audios=[];it.note='';it.status='';it.src='';it.evDate='';
    mark('items',it,it.key);
  });
  if(changed){assignNumbers(c);c.entries.forEach(function(e){mark('entries',e,e.id)})}
  return changed;
}
function migrateOld(){
  var raw=null;try{raw=localStorage.getItem(OLDKEY)}catch(e){}
  var lang=null;try{lang=localStorage.getItem('as_lang')}catch(e){}
  if(lang&&(lang==='en-US'||lang==='zh-CN')){S.lang=lang;setMeta('lang',lang)}
  if(lang){try{localStorage.removeItem('as_lang')}catch(e){}}
  if(!raw)return noop();
  var old;try{old=JSON.parse(raw)}catch(e){return noop()}
  if(!old||!old.cases||!old.cases.length){try{localStorage.removeItem(OLDKEY)}catch(e){}return noop()}
  var n=0,migrated=[];
  old.cases.forEach(function(oc){
    if(caseById(oc.id))return;
    var c={id:oc.id||uid(),client:oc.client||'(migrated)',date:oc.date||today(),auditor:oc.auditor||'',created:oc.created||new Date().toISOString(),capState:'finished',capMs:0,items:{},entries:[]};
    Object.keys(oc.items||{}).forEach(function(k){
      var o=oc.items[k],it=blankItem(c,k);
      ['status','src','sample','evDate','note','stmt','sev'].forEach(function(f){it[f]=o[f]||''});
      it.photos=[];it.audios=[];
      (o.photos||[]).forEach(function(p){
        if(!p||!p.t)return;
        try{var b=dataUrlToBlob(p.t),id='b'+uid();B[id]={id:id,caseId:c.id,kind:'photo',mime:b.type,blob:b,ts:p.ts||''};
          it.photos.push({id:id,ts:p.ts||'',mime:b.type,size:b.size})}catch(e){}
      });
      c.items[k]=it;
    });
    convertLegacy(c);dirty={};
    loadedBlobs[c.id]=true;db.cases.push(c);migrated.push(c);n++;
  });
  return Promise.all(migrated.map(function(c){return persistFullCase(c)})).then(function(){
    return tx(['cases'],'readonly',function(s){return s.count()});
  }).then(function(r){
    if(r.result>=db.cases.length){try{localStorage.removeItem(OLDKEY)}catch(e){}if(n)toast('Migrated '+n+' case(s) from rev01 已迁移 '+n+' 个案卷')}
  }).catch(function(e){fatal(e,'migrate')});
}
function migrateRev02(){
  var n=0;
  db.cases.forEach(function(c){if(convertLegacy(c))n++});
  if(n){toast('Upgraded '+n+' case(s) from rev02 into the timeline 已把 '+n+' 个旧案卷升级为时间线');return flush()}
  return noop();
}

function nagState(){
  if(!db.cases.length)return null;
  var ref=S.lastBackup||0;
  if(!ref){db.cases.forEach(function(c){var t=Date.parse(c.created)||Date.now();if(!ref||t<ref)ref=t})}
  var late=(Date.now()-ref)>NAG_MS;
  return{late:late,never:!S.lastBackup,days:Math.floor((Date.now()-ref)/86400000)};
}
function backupBanner(){

/* ---------- backup / restore ---------- */
function buildBackup(cases){
  var out={format:'as-secretary-backup',version:4,app:'AS · Auditing Secretary rev03',exported:new Date().toISOString(),cases:[]};
  var chain=Promise.resolve();
  cases.forEach(function(c){
    chain=chain.then(function(){return loadBlobs(c.id)}).then(function(){
      var e={case:caseOut(c),items:{},entries:[]},jobs=[];
      Object.keys(c.items).forEach(function(k){var it=c.items[k];if(it.stmt||it.sev||it.sample)e.items[k]={stmt:it.stmt||'',sev:it.sev||'',sample:it.sample||''}});
      c.entries.forEach(function(x){
        var o={id:x.id,n:x.n,kind:x.kind,ts:x.ts,text:x.text||'',note:x.note||'',via:x.via||'',mime:x.mime||'',size:x.size||0,w:x.w,h:x.h,dur:x.dur,tag:x.tag||'',status:x.status||'',clause:ecl(x)};
        if(x.kind!=='text'&&B[x.id])jobs.push(blobToDataUrl(B[x.id].blob).then(function(u){o.data=u}));
        e.entries.push(o);
      });
      out.cases.push(e);
      return Promise.all(jobs);
    });
  });
  return chain.then(function(){return new Blob([JSON.stringify(out)],{type:'application/json'})});
}
function doBackup(cases,name){
  return buildBackup(cases).then(function(b){
    download(name,'application/json',b);
    return setMeta('lastBackup',Date.now()).then(function(){toast('Backup saved 已备份 ('+Math.round(b.size/1024)+' KB) — keep it in Files/iCloud 请存到“文件”/iCloud');render()});
  }).catch(function(e){fatal(e,'backup')});
}
function restoreFile(file){
  var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result)}catch(e){toast('Not a valid backup file 不是有效的备份文件');return}
    var list=[];
    if(d&&d.format==='as-secretary-backup'&&d.cases)list=d.cases;
    else if(d&&d.client&&d.items)list=[{case:d,items:d.items}];
    else{toast('Unrecognized file 无法识别的文件');return}
    var added=0,skipped=0,chain=Promise.resolve();
    list.forEach(function(e){
      var oc=e.case||{};
      if(!oc.id||caseById(oc.id)){skipped++;return}
      var c={id:oc.id,client:oc.client||'(restored)',date:oc.date||today(),auditor:oc.auditor||'',created:oc.created||new Date().toISOString(),capState:oc.capState==='active'?'held':(oc.capState||'finished'),capMs:oc.capMs||0,items:{},entries:[]};
      try{
        Object.keys(e.items||{}).forEach(function(k){
          var o=e.items[k],it=blankItem(c,k);
          ['stmt','sev','sample'].forEach(function(f){it[f]=o[f]||''});
          if(o.photos||o.audios||o.note||o.status){          // rev01 / rev02 backup: per-item notes and media
            it.note=o.note||'';it.status=o.status||'';it.photos=[];it.audios=[];
            (o.photos||[]).forEach(function(m){var u=m.data||m.t;if(!u)return;var b=dataUrlToBlob(u),id=m.id&&!B[m.id]?m.id:'b'+uid();
              B[id]={id:id,caseId:c.id,kind:'photo',mime:b.type||m.mime,blob:b,ts:m.ts||''};it.photos.push({id:id,ts:m.ts||'',mime:b.type||m.mime,size:b.size,w:m.w,h:m.h})});
            (o.audios||[]).forEach(function(m){if(!m.data)return;var b=dataUrlToBlob(m.data),id=m.id&&!B[m.id]?m.id:'b'+uid();
              B[id]={id:id,caseId:c.id,kind:'audio',mime:m.mime||b.type,blob:b,ts:m.ts||''};it.audios.push({id:id,ts:m.ts||'',mime:m.mime||b.type,size:b.size,dur:m.dur})});
          }
          c.items[k]=it;
        });
        (e.entries||[]).forEach(function(o){
          var id=o.id&&!B[o.id]&&!entById(c,o.id)?o.id:'b'+uid();
          var x={id:id,caseId:c.id,n:o.n||0,kind:o.kind,ts:o.ts,text:o.text||'',note:o.note||'',via:o.via||'',mime:o.mime||'',size:o.size||0,w:o.w,h:o.h,dur:o.dur,tag:o.tag||'',status:o.status||''};x.clause=ecl({clause:o.clause,tag:x.tag});
          if(x.kind!=='text'){if(!o.data)return;var b=dataUrlToBlob(o.data);x.mime=b.type||o.mime;x.size=b.size;B[id]={id:id,caseId:c.id,kind:x.kind,mime:x.mime,blob:b,ts:x.ts}}
          c.entries.push(x);
        });
        convertLegacy(c);dirty={};assignNumbers(c);c.upd=new Date().toISOString();c.entries.forEach(function(x){x.upd=c.upd});
      }catch(err){toast('Backup file is damaged 备份文件已损坏');return}
      loadedBlobs[c.id]=true;
      chain=chain.then(function(){return persistFullCase(c)}).then(function(){db.cases.push(c);db.cases.sort(function(a,b){return (a.created||'')<(b.created||'')?-1:1});added++});
    });
    chain.then(function(){toast('Restored 已恢复 '+added+' · skipped 跳过 '+skipped+' (already here 已存在)');render();changed()},function(e){fatal(e,'restore')});
  };
  r.onerror=function(){toast('Could not read file 无法读取文件')};
  r.readAsText(file);
}

/* ---------- media: audio recording (MediaRecorder) ---------- */
function pickMime(){
  if(!window.MediaRecorder||!MediaRecorder.isTypeSupported)return '';
  var c=['audio/mp4','audio/mp4;codecs=mp4a.40.2','audio/aac','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
  for(var i=0;i<c.length;i++){try{if(MediaRecorder.isTypeSupported(c[i]))return c[i]}catch(e){}}
  return '';
}
function startRec(){
  var c=cur();if(!c||c.capState!=='active')return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast('Recording not supported here 此浏览器不支持录音 (needs https and a modern browser 需要 https)');return}
  if(R){toast('Already recording 正在录音');return}
  doStartRec();
}
function doStartRec(){
  var c=cur();if(!c)return;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mime=pickMime(),mr;
    try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}
    catch(e){stream.getTracks().forEach(function(t){t.stop()});toast('Cannot start recording 无法开始录音');return}
    R={caseId:c.id,mr:mr,stream:stream,chunks:[],t0:Date.now(),mime:mr.mimeType||mime||'audio/mp4',discard:false};
    var me=R;
    mr.ondataavailable=function(e){if(e.data&&e.data.size)me.chunks.push(e.data)};
    mr.onstop=function(){finishRec(me)};
    mr.onerror=function(){me.discard=false;finishRec(me)};
    try{mr.start(1000)}catch(e){mr.start()}
    me.timer=setInterval(function(){
      var s=(Date.now()-me.t0)/1000,el=$('#rt');if(el)el.textContent=mmss(s);
      if(s>=600){stopRec(true);toast('10 min limit reached 已达 10 分钟上限')}
    },500);
    render();
  }).catch(function(e){toast('Microphone unavailable or blocked 麦克风不可用或被拒绝 ('+((e&&e.name)||'')+')')});
}
function stopRec(save){
  if(!R)return;R.discard=!save;
  try{if(R.mr.state!=='inactive')R.mr.stop();else finishRec(R)}catch(e){finishRec(R)}
}
function finishRec(r){
  if(!r||r.done)return;r.done=true;clearInterval(r.timer);
  try{r.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  if(R===r)R=null;
  var c=caseById(r.caseId);
  if(!r.discard&&r.chunks.length&&c){
    var blob=new Blob(r.chunks,{type:r.chunks[0].type||r.mime});
    return addEntry(c,'audio',{dur:(Date.now()-r.t0)/1000},blob).then(function(e){if(e)toast('Recording saved 录音已保存 → #'+e.n);render();return e});
  }else render();
  return Promise.resolve();
}

function liveEntries(c){return c.entries}
function tombsOf(caseId){return Object.keys(TOMB).filter(function(k){return TOMB[k].kind==='e'&&TOMB[k].caseId===caseId})}

  c.entries.forEach(function(e){if(e.efail||e.mfail)failed++;else if(eSV(e)===eV(e)&&(e.kind==='text'||e.mok))done++});

function dotCls(c){if(!hasCode())return 'off';return prog(c).synced?'ok':'pend'}
function syncText(c,short){
  if(!hasCode())return short?'':'local only 仅本机';

  if(p.failed)return short?p.done+'/'+p.tot:p.done+' of '+p.tot+' uploaded 已传 '+p.done+'/'+p.tot+' · '+p.failed+' not sent 未传';

function sdot(c,txt){return '<i class="sdot '+dotCls(c)+'" data-sc="'+c.id+'" aria-hidden="true"></i>'+(txt?'<span class="sdt" data-sp="'+c.id+'"'+(txt==='s'?' data-short="1"':'')+'>'+esc(syncText(c,txt==='s'))+'</span>':'')}
function totals(){
  var o={items:0,done:0,failed:0,pend:0};
  db.cases.forEach(function(c){var p=prog(c);o.items+=p.tot;o.done+=p.done;o.failed+=p.failed;o.pend+=(p.tot-p.done-p.failed)+(p.caseOk||c.cfail?0:1)});

function failCounts(){
  var f={};

/* ----- tombstones ----- */

function tombEntry(c,e){

function tombCase(c){

/* ----- network ----- */
function api(method,path,o){
  o=o||{};
  return new Promise(function(res,rej){
    var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort();rej({net:true,why:'timeout'})},o.timeout||20000);
    var h={};if(!o.noCode)h['X-AS-Code']=normCode(S.testerCode);
    if(o.type)h['Content-Type']=o.type;
    var opt={method:method,headers:h,cache:'no-store',credentials:'omit',mode:'cors'};
    if(o.body!=null)opt.body=o.body;if(ctl)opt.signal=ctl.signal;
    fetch(AS_SERVER+path,opt).then(function(r){
      return r.text().then(function(t){clearTimeout(to);var j=null;try{j=JSON.parse(t)}catch(e){}res({status:r.status,j:j})})
    },function(e){clearTimeout(to);rej({net:true,why:String(e&&e.message||e)})});
  });
}
function errOf(r){return(r.j&&r.j.error)||('http_'+r.status)}
function setSY(state,msg){SY.state=state;SY.msg=msg||'';updSyncUI()}
function checkConn(){
  if(!hasCode()){SY.conn='';setSY('off');return Promise.resolve()}
  if(navigator.onLine===false){SY.conn='offline';setSY('offline');return Promise.resolve()}
  SY.conn='check';updSyncUI();
  return api('GET','/health',{noCode:true,timeout:10000}).then(function(r){
    if(!(r.status===200&&r.j&&r.j.ok)){SY.conn='down';if(SY.state!=='syncing')setSY('retry');return}
    return api('GET','/v1/usage',{timeout:10000}).then(function(u){
      if(u.status===200&&u.j){SY.conn='ok';SY.usage=u.j;if(SY.state==='badcode'||SY.state==='offline'||SY.state==='retry'||SY.state==='off')setSY('idle');else updSyncUI()}
      else if(u.status===401){SY.conn='badcode';setSY('badcode')}
      else{SY.conn='down';setSY('retry')}
    });
  },function(){SY.conn=navigator.onLine===false?'offline':'down';if(SY.state!=='syncing')setSY(navigator.onLine===false?'offline':'retry')});
}
/* ----- queue ----- */
function sortedCases(){return db.cases.slice().sort(function(a,b){return (b.id===S.cur)-(a.id===S.cur)||((b.created||'')<(a.created||'')?-1:1)})}
function nextJob(){
  var cs=sortedCases(),i,j,c,e,ks;
  for(i=0;i<cs.length;i++){                               // phase 1: small JSON (case, entries, entry deletes)
    c=cs[i];if(c.cfail)continue;
    if(cSV(c)!==cV(c))return{t:'case',c:c};
    for(j=0;j<c.entries.length;j++){e=c.entries[j];if(!e.efail&&!e.mfail&&eSV(e)!==eV(e))return{t:'entry',c:c,e:e}}
    ks=tombsOf(c.id);if(ks.length)return{t:'tombe',c:c,k:ks[0]};
  }
  ks=Object.keys(TOMB);for(i=0;i<ks.length;i++)if(TOMB[ks[i]].kind==='c')return{t:'tombc',k:ks[i]};
  for(i=0;i<cs.length;i++){                               // phase 2: photos and recordings
    c=cs[i];if(c.cfail)continue;
    for(j=0;j<c.entries.length;j++){e=c.entries[j];if(e.kind!=='text'&&!e.mok&&!e.mfail&&!e.efail)return{t:'media',c:c,e:e}}
  }
  return null;
}
function pendingAny(){return !!nextJob()}
function getBlob(id){
  if(B[id])return Promise.resolve(B[id]);
  if(!idb)return Promise.resolve(null);
  return tx(['blobs'],'readonly',function(s){return s.get(id)}).then(function(r){return r.result||null});
}
function saveEnt(c,e){if(c.entries.indexOf(e)>-1){dirty['entries|'+e.id]=['entries',e];clearTimeout(flushT);flushT=setTimeout(flush,250)}}
function saveCase(c){if(caseById(c.id)===c)putCase(c)}
/* result of one job: 'ok' | 'skip' (this item failed for good) | 'stop' (global problem, stop the run) | 'retry' (transient) */
function classify(r,what){
  if(r.status>=200&&r.status<300)return 'ok';
  var er=errOf(r);
  if(r.status===401){SY.conn='badcode';return 'badcode'}
  if(r.status===413&&er==='quota_exceeded')return 'quota';
  if(r.status===404&&er==='case_not_found')return 'recase';
  if(r.status===408||r.status===429||r.status>=500)return 'retry';
  return 'fail:'+er;
}
function doJob(j){
  var v,body,c=j.c,e=j.e;
  if(j.t==='case'){
    v=cV(c);SY.cur=c.id;
    return api('POST','/v1/case',{type:'application/json',body:JSON.stringify(caseBody(c,false))}).then(function(r){
      var k=classify(r);
      if(k==='ok'){c.sv=v;saveCase(c)}else if(k.slice(0,5)==='fail:'){c.cfail=k.slice(5)||'rejected';saveCase(c)}
      return k;
    });
  }
  if(j.t==='entry'){
    v=eV(e);SY.cur=e.id;
    if(!ID_RE.test(e.id)||!ID_RE.test(c.id)){e.efail={code:'bad_id'};saveEnt(c,e);return Promise.resolve('skip')}
    return api('PUT','/v1/entry',{type:'application/json',body:JSON.stringify(entryBody(c,e,false))}).then(function(r){
      var k=classify(r);
      if(k==='ok'){e.sv=v;saveEnt(c,e)}else if(k.slice(0,5)==='fail:'){e.efail={code:k.slice(5)};saveEnt(c,e)}
      else if(k==='recase'){SY.recase[c.id]=(SY.recase[c.id]||0)+1;if(SY.recase[c.id]>3){c.cfail='case_not_found';saveCase(c)}else{c.sv=0;saveCase(c)}}
      return k;
    });
  }
  if(j.t==='tombe'||j.t==='tombc'){
    var t=TOMB[j.k];if(!t)return Promise.resolve('ok');
    SY.cur='';
    return api(t.kind==='c'?'POST':'PUT',t.kind==='c'?'/v1/case':'/v1/entry',{type:'application/json',body:JSON.stringify(t.body)}).then(function(r){
      var k=classify(r);
      if(k==='ok'||k.slice(0,5)==='fail:'||k==='recase')return dropTomb(j.k).then(function(){return k==='recase'?'ok':k});
      return k;
    });
  }
  /* media */
  SY.cur=e.id;
  return getBlob(e.id).then(function(rec){
    if(!rec||!rec.blob){e.mfail='missing';saveEnt(c,e);return 'skip'}
    var bl=rec.blob,mt=baseMime(bl.type||e.mime||'').toLowerCase()||'application/octet-stream';
    if(e.kind==='photo'&&mt.indexOf('image/')!==0)mt='image/jpeg';
    if(bl.size<=0){e.mfail='empty';saveEnt(c,e);return 'skip'}
    if(bl.size>MAXMEDIA){e.mfail='too_large';saveEnt(c,e);return 'skip'}
    return api('PUT','/v1/media/'+encodeURIComponent(c.id)+'/'+encodeURIComponent(e.id),{type:mt,body:bl,timeout:60000+Math.round(bl.size/20)}).then(function(r){
      var k=classify(r);
      if(k==='ok'){e.mok=true;saveEnt(c,e)}
      else if(k.slice(0,5)==='fail:'){e.mfail=k.slice(5);saveEnt(c,e)}
      else if(k==='recase'){e.sv=0;SY.recase[c.id]=(SY.recase[c.id]||0)+1;if(SY.recase[c.id]>3){e.mfail='case_not_found'}else{c.sv=0;saveCase(c)}saveEnt(c,e)}
      return k;
    });
  });
}
function backoffMs(){return Math.min(SYNC_RETRY_MAX_MS,SYNC_RETRY_BASE_MS*Math.pow(2,Math.max(0,SY.fails-1)))*(0.75+Math.random()*0.5)}
function kick(ms){
  if(!hasCode())return;
  clearTimeout(SY.timer);SY.timer=setTimeout(function(){SY.timer=null;syncRun()},ms==null?1500:ms);
}
function syncRun(){
  if(!hasCode()){setSY('off');return}
  if(SY.run){SY.again=true;return}
  if(navigator.onLine===false){SY.conn='offline';setSY('offline');return}
  if(SY.state==='badcode'&&!SY.force)return;
  if(SY.state==='quota'&&Date.now()<SY.qUntil&&!SY.force)return;
  SY.run=true;SY.again=false;SY.force=false;SY.recase={};
  var n=0,did=0;
  setSY('syncing');
  function loop(){
    var j=nextJob();
    if(!j||++n>20000)return Promise.resolve('done');
    return doJob(j).then(function(k){
      if(k==='ok'){did++;SY.fails=0;SY.conn='ok';SY.lastOk=Date.now();updSyncUI();return loop()}
      if(k==='skip'||k.slice(0,5)==='fail:'||k==='recase'){updSyncUI();return loop()}
      return k;
    });
  }
  function end(k){
    SY.run=false;SY.cur='';
    if(!hasCode()){setSY('off');return}
    if(k==='badcode'){SY.fails=0;setSY('badcode');toast('Code not accepted 口令无效');return}
    if(k==='quota'){SY.fails=0;SY.qUntil=Date.now()+30*60000;setSY('quota');toast('Monthly upload limit reached 本月上传额度已满');return}
    if(k==='retry'||k==='net'){SY.fails++;var ms=backoffMs();SY.conn=navigator.onLine===false?'offline':'down';setSY(navigator.onLine===false?'offline':'retry');kick(ms);return}
    SY.fails=0;
    if(SY.again||pendingAny()){kick(300);setSY('idle');return}
    setSY('idle');
    if(did){api('GET','/v1/usage',{timeout:10000}).then(function(u){if(u.status===200&&u.j){SY.usage=u.j;updSyncUI()}},function(){})}
  }
  return loop().then(end,function(e){end(e&&e.net?'net':'retry')});
}
function uploadNow(){

  db.cases.forEach(function(c){var ch=false;if(c.cfail){delete c.cfail;ch=true}
    c.entries.forEach(function(e){if(e.efail||e.mfail){delete e.efail;delete e.mfail;dirty['entries|'+e.id]=['entries',e];ch=true}});
    if(ch)putCase(c)});

    if(chg)resetMarkers();

    '<input id="tc" class="mask" data-act="tc" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="'+esc(hasCode()?maskCode():'Type or paste your code 输入或粘贴口令')+'"></div>'+
    '<div class="r"><div class="row nw"><button class="btn sm plain" data-act="tcpaste">'+ic('copy')+'Paste 粘贴</button><button class="btn sm" data-act="tcsave">'+ic('check')+'Save 保存</button><button class="btn sm dan" data-act="tcclear"'+(hasCode()?'':' disabled')+'>'+ic('trash')+'Clear 清除</button></div></div></div>';
  h+='<div id="uplBot">'+uplBotHtml()+'</div>';
  h+='<div class="note" style="margin-top:18px"><b>What is uploaded 上传内容.</b> Case details, notes, tags, status, clause, photos and recordings are copied to the AS Collector server for this trial, in the background whenever you are online. Uploading never removes anything from this phone. Entries you delete are marked deleted on the server, not erased. 案卷信息、备注、归类、状态、条款、照片和录音会在联网时自动复制到 AS Collector 服务器（试用）。上传不会删除手机上的任何内容；你删除的条目在服务器上只做删除标记，不会清除。<br>The Summary page fields (finding statement, severity, sample) are not uploaded yet. 总结页的不符合声明、严重程度、抽样暂不上传。</div></div>';
  return h;
}
function rowText(){
  if(!hasCode())return 'Not connected 未连接 · add your tester code 点此输入试用口令';
  var l=connLine(),t=totals();
  return (l.ok?'Connected 已连接':'Not connected 未连接')+' · '+(SY.state==='syncing'?'uploading 上传中':t.pend?t.pend+' item(s) waiting 项待传':t.failed?t.failed+' item(s) not sent 项未能上传':'all uploaded 已全部上传');
}
function updSyncUI(){
  var els,i,c;
  els=document.querySelectorAll('[data-sc]');
  for(i=0;i<els.length;i++){c=caseById(els[i].getAttribute('data-sc'));if(c)els[i].className='sdot '+dotCls(c)}
  els=document.querySelectorAll('[data-sp]');
  for(i=0;i<els.length;i++){c=caseById(els[i].getAttribute('data-sp'));if(c)els[i].textContent=syncText(c,els[i].hasAttribute('data-short'))}
  if(view==='upload'){var a=$('#uplTop'),b=$('#uplBot');if(a)a.innerHTML=uplTopHtml();if(b)b.innerHTML=uplBotHtml()}
  var r=$('#uplRowT');if(r)r.textContent=rowText();
  var ud=$('#uplRowD');if(ud)ud.className='sdot '+(hasCode()&&connLine().ok?'ok':'off');
}
function changed(){updSyncUI();if(hasCode())kick()}
window.addEventListener('online',function(){if(hasCode()){SY.fails=0;checkConn().then(function(){kick(0)})}});
window.addEventListener('offline',function(){if(hasCode()){SY.conn='offline';setSY('offline')}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&hasCode()&&!SY.run)kick(800)});
setInterval(function(){if(hasCode()&&!SY.run&&!SY.timer&&SY.state!=='badcode'&&pendingAny())kick(0)},30000);
function bootSync(){
  if(!hasCode()){SY.state='off';return}
  SY.state='idle';
  checkConn().then(function(){if(SY.state!=='badcode')kick(300)});
}

/* ---------- boot ---------- */
openDB().then(function(d){idb=d;idb.onversionchange=function(){idb.close();idb=null}}).catch(function(e){memOnly=true;console.warn('IndexedDB unavailable',e)})
.then(function(){return idb?loadAll():noop()})
.then(function(){return idb?migrateOld():noop()})
.then(function(){return idb?migrateRev02():noop()})
.then(function(){
  if(S.cur&&!caseById(S.cur))S.cur=null;
  render();askPersist();bootSync();
  window.__asReady=true;
}).catch(function(e){console.warn(e);render();window.__asReady=true});
})();
</script></body></html>
