<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#e8e8e8;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom);max-width:720px;margin:0 auto}
a{color:#7cc4ff}
.back{position:sticky;top:0;z-index:50;background:#000;border-bottom:1px solid #2a2a2a;padding:calc(env(safe-area-inset-top) + 4px) 12px 4px}
.back a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-weight:600}
.wrap{padding:12px}
h1{font-size:21px;margin:6px 0 2px}
.zh{color:#9aa;font-size:.88em;font-weight:400}
.meta{color:#999;font-size:13px}
.draft{display:inline-block;border:1px solid #f5a623;color:#f5a623;border-radius:4px;padding:0 6px;font-size:12px;font-weight:700;letter-spacing:.5px;margin-left:6px}
.note{background:#0c0c0c;border:1px solid #262626;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:13.5px;color:#bbb}
.note b{color:#ddd}
.warn{border-color:#6b4a10;background:#150f02;color:#f0c57a}
.card{background:#0d0d0d;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:48px;min-width:48px;padding:8px 14px;border-radius:10px;border:1px solid #3a3a3a;background:#161616;color:#eee;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active{background:#262626}
.btn.pri{background:#1b4f8a;border-color:#2d73c4;color:#fff}
.btn.dan{border-color:#7a2323;color:#ff8d8d}
.btn.sm{min-height:44px;padding:6px 10px;font-size:14px}

<script>
(function(){
'use strict';
var CLAUSE='ISO 9001:2015 §8.4.1';
var OLDKEY='as_proto_v1';
var NAG_MS=3*24*3600*1000;

/* ---------- content: 8.4.1 items (used only for tagging + summary) ---------- */
var ITEMS=[
 {id:'list',a:'Supplier list is current',az:'供方清单是最新的',
  req:'The organization determines which external providers (incl. outsourced processes) it uses and keeps that scope known and current.',
  reqz:'组织要明确所使用的外部供方（含外包过程），并保持范围清晰、及时更新。'},
 {id:'crit',a:'Evaluation & selection criteria defined',az:'已定义评价与选择准则',
  req:'Criteria for evaluating and selecting external providers are determined and applied, based on their ability to meet requirements.',

 {id:'rec',a:'Evaluation / re-evaluation records',az:'评价与再评价记录',
  req:'Documented information is retained for evaluation, selection and re-evaluation activities.',
  reqz:'评价、选择、再评价活动要保留成文信息。'},
 {id:'mon',a:'Performance monitoring',az:'绩效监视',
  req:'Supplier performance is monitored against defined measures.',
  reqz:'要按既定指标监视供方绩效。'},
 {id:'proc',a:'Outsourced process control',az:'外包过程控制',
  req:'External providers and outsourced processes stay within the organization’s quality management system controls.',
  reqz:'外部供方和外包过程要处于组织质量管理体系的控制之下。'},
 {id:'risk',a:'Risk basis for type / extent of control',az:'控制类型与程度的风险依据',
  req:'The type and extent of control reflect the risk and the effect on the ability to meet customer requirements.',
  reqz:'控制的类型和程度应与风险及其对满足顾客要求能力的影响相适应。'},
 {id:'poor',a:'Actions on poor performers',az:'对绩效差的供方采取措施',
  req:'Actions arising from evaluations and monitoring are taken and records of them are kept.',
  reqz:'评价和监视产生的措施要落实，并保留记录。'},
 {id:'smp',a:'Sample size / records seen',az:'抽样数量 / 已看记录',
  req:'(Auditor housekeeping) The audit sample is stated so findings can be traced and judged.',
  reqz:'（审核员备忘）写明抽样情况，使发现可追溯、可判断。'}
];
var STATUS=[['seen','Seen','看到'],['not','Not seen','未看到'],['na','N/A','不适用']];

/* ---------- state ---------- */
var db={cases:[]};
var S={cur:null,lang:'en-US',email:'',lastBackup:0};
var B={}, loadedBlobs={}, urls={};
var view='home', tab='capture', filt='all', openE={};
var idb=null, memOnly=false, persistState='unknown';
var voice=null, R=null, audioConsent=false, saveInfo='';
var dirty={}, flushT=null, lastTick=Date.now(), tickN=0;

function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function uid(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return ('0'+n).slice(-2)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hhmm(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())}
function fmt(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function toast(m){var t=$('#toast');t.innerHTML='<div class="toast">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){t.innerHTML=''},4200)}
function fatal(e,what){try{console.warn(what,e)}catch(_){}
  var n=e&&e.name;
  toast(n==='QuotaExceededError'?'Storage full 存储已满 — export a backup and free space 请导出备份并释放空间':'Could not save 保存失败 ('+(n||'error')+') — export a backup 请导出备份')}
function mmss(s){s=Math.round(s||0);return Math.floor(s/60)+':'+pad(s%60)}
function clock(ms){var s=Math.floor((ms||0)/1000);return pad(Math.floor(s/60))+':'+pad(s%60)}
function cur(){for(var i=0;i<db.cases.length;i++)if(db.cases[i].id===S.cur)return db.cases[i];return null}
function caseById(id){for(var i=0;i<db.cases.length;i++)if(db.cases[i].id===id)return db.cases[i];return null}
function urlFor(id){if(!urls[id]&&B[id])urls[id]=URL.createObjectURL(B[id].blob);return urls[id]||''}
function extOf(m){m=(m||'').toLowerCase();return m.indexOf('mp4')>-1||m.indexOf('aac')>-1?'m4a':m.indexOf('webm')>-1?'webm':m.indexOf('ogg')>-1?'ogg':m.indexOf('jpeg')>-1?'jpg':'bin'}
function baseMime(m){return(m||'application/octet-stream').split(';')[0]}
function dataUrlToBlob(u){
  var m=/^data:([^,]*?)(;base64)?,([\s\S]*)$/.exec(u||''); if(!m)throw new Error('bad data url');
  var bin=m[2]?atob(m[3]):decodeURIComponent(m[3]), a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:m[1]||'application/octet-stream'});
}
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(b)})}
function itemOf(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].id===id)return ITEMS[i];return null}

/* ---------- data model ----------
 case:  {id,client,date,auditor,created,capState,capMs, items:{clauseId:{stmt,sev,sample}}, entries:[...]}
 entry: {id,caseId,n,kind:'photo'|'audio'|'text',ts,text,note,via,mime,size,w,h,dur,tag,status}   (blob id == entry id) */
function blankItem(c,id){return{key:c.id+'|'+id,caseId:c.id,itemId:id,stmt:'',sev:'',sample:''}}
function item(c,id){if(!c.items[id])c.items[id]=blankItem(c,id);return c.items[id]}
function caseRec(c){return{id:c.id,client:c.client,date:c.date,auditor:c.auditor||'',created:c.created,capState:c.capState||'finished',capMs:c.capMs||0}}
function sortEntries(c){c.entries.sort(function(a,b){return (a.n||0)-(b.n||0)||(a.ts<b.ts?-1:1)})}
function nextN(c){var m=0;c.entries.forEach(function(e){if(e.n>m)m=e.n});return m+1}
function entById(c,id){for(var i=0;i<c.entries.length;i++)if(c.entries[i].id===id)return c.entries[i];return null}
function assignNumbers(c){
  var un=c.entries.filter(function(e){return !e.n}).sort(function(a,b){return a.ts<b.ts?-1:1}),n=nextN(c);
  un.forEach(function(e){e.n=n++});sortEntries(c);
}
function kindEn(e){return e.kind==='photo'?'Photo':e.kind==='audio'?'Voice recording':(e.via==='dictated'?'Dictated note':'Note')}
function kindZh(e){return e.kind==='photo'?'照片':e.kind==='audio'?'语音':(e.via==='dictated'?'听写':'文字')}
function fileName(e){var nn=(e.n<10?'0':'')+e.n;return 'E'+nn+(e.kind==='photo'?'-photo.jpg':'-voice.'+extOf(e.mime))}

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise(function(res,rej){
  if(!window.indexedDB){rej(new Error('IndexedDB unavailable'));return}
  var r;try{r=indexedDB.open('as_secretary',2)}catch(e){rej(e);return}
  r.onupgradeneeded=function(){var d=r.result,n=d.objectStoreNames;
    if(!n.contains('cases'))d.createObjectStore('cases',{keyPath:'id'});
    if(!n.contains('items'))d.createObjectStore('items',{keyPath:'key'}).createIndex('caseId','caseId');
    if(!n.contains('blobs'))d.createObjectStore('blobs',{keyPath:'id'}).createIndex('caseId','caseId');
    if(!n.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});
    if(!n.contains('entries'))d.createObjectStore('entries',{keyPath:'id'}).createIndex('caseId','caseId');
  };
  r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.onblocked=function(){rej(new Error('blocked'))};
})}
function tx(names,mode,fn){return new Promise(function(res,rej){
  var t,out;
  try{t=idb.transaction(names,mode);out=fn.apply(null,names.map(function(n){return t.objectStore(n)}))}catch(e){rej(e);return}
  t.oncomplete=function(){res(out)};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error||new Error('aborted'))};
})}
function noop(){return Promise.resolve()}
function setMeta(k,v){S[k]=v;if(!idb)return noop();return tx(['meta'],'readwrite',function(m){m.put({k:k,v:v})}).catch(function(e){fatal(e,'meta')})}
function putCase(c){if(!idb)return noop();return tx(['cases'],'readwrite',function(s){s.put(caseRec(c))}).catch(function(e){fatal(e,'case')})}
function mark(store,obj,key){dirty[store+'|'+key]=[store,obj];clearTimeout(flushT);flushT=setTimeout(flush,250);setInd('saving')}
function markItem(c,id){mark('items',item(c,id),c.id+'|'+id)}
function markEnt(e){mark('entries',e,e.id)}
function flush(){
  clearTimeout(flushT);var jobs=Object.keys(dirty).map(function(k){return dirty[k]});dirty={};
  if(!jobs.length||!idb)return noop();
  return tx(['items','entries'],'readwrite',function(is,es){jobs.forEach(function(j){(j[0]==='items'?is:es).put(j[1])})})
    .then(function(){saveInfo='Saved on this device 已存本机 '+hhmm();setInd()},function(e){fatal(e,'flush')});
}
function setInd(s){var el=$('#ind');var t=s==='saving'?'Saving… 保存中…':saveInfo;if(el)el.textContent=t}
function loadBlobs(caseId){
  if(loadedBlobs[caseId]||!idb){loadedBlobs[caseId]=true;return noop()}
  return tx(['blobs'],'readonly',function(s){return s.index('caseId').getAll(caseId)}).then(function(r){
    (r.result||[]).forEach(function(x){B[x.id]=x});loadedBlobs[caseId]=true;
  });
}
function persistFullCase(c){
  if(!idb)return noop();
  return tx(['cases','items','blobs','entries'],'readwrite',function(cs,is,bs,es){
    cs.put(caseRec(c));
    Object.keys(c.items).forEach(function(k){is.put(c.items[k])});
    c.entries.forEach(function(e){es.put(e);if(B[e.id])bs.put(B[e.id])});
  });
}
function delCaseDb(id){
  if(!idb)return noop();
  return tx(['cases','items','blobs','entries'],'readwrite',function(cs,is,bs,es){
    cs.delete(id);
    [is,bs,es].forEach(function(st){
      var rq=st.index('caseId').openKeyCursor(IDBKeyRange.only(id));
      rq.onsuccess=function(){var cu=rq.result;if(cu){st.delete(cu.primaryKey);cu.continue()}};
    });
  });
}
function loadAll(){
  return tx(['cases','items','entries','meta'],'readonly',function(cs,is,es,ms){return[cs.getAll(),is.getAll(),es.getAll(),ms.getAll()]}).then(function(rs){
    var cases=rs[0].result||[],items=rs[1].result||[],ents=rs[2].result||[],metas=rs[3].result||[];
    metas.forEach(function(m){S[m.k]=m.v});
    var map={};cases.forEach(function(c){c.items={};c.entries=[];map[c.id]=c;
      if(!c.capState)c.capState='finished';else if(c.capState==='active')c.capState='held';   // a reload cannot keep a live capture running
      c.capMs=c.capMs||0});
    items.forEach(function(it){if(map[it.caseId])map[it.caseId].items[it.itemId]=it});
    ents.forEach(function(e){if(map[e.caseId])map[e.caseId].entries.push(e)});
    cases.forEach(sortEntries);
    cases.sort(function(a,b){return (a.created||'')<(b.created||'')?-1:1});
    db.cases=cases;
  });
}

/* ---------- migration: rev01 (localStorage) and rev02 (per-item notes/photos/audio) -> timeline entries ---------- */
function convertLegacy(c){
  var changed=false;
  Object.keys(c.items).forEach(function(k){
    var it=c.items[k],ph=it.photos||[],au=it.audios||[],has=ph.length||au.length||it.note||it.status;
    if(!has)return;
    changed=true;
    var base=(ph[0]&&ph[0].ts)||(au[0]&&au[0].ts)||c.created||new Date().toISOString(),made=0;
    function mk(kind,o){var e={id:o.id||'b'+uid(),caseId:c.id,n:0,kind:kind,ts:o.ts||base,text:o.text||'',note:'',via:o.via||'',mime:o.mime||'',size:o.size||0,w:o.w,h:o.h,dur:o.dur,tag:k,status:it.status||''};c.entries.push(e);made++}
    ph.forEach(function(m){mk('photo',m)});
    au.forEach(function(m){mk('audio',m)});
    if(it.note)mk('text',{text:it.note,via:'typed'});
    if(!made)mk('text',{text:'(status carried over from an earlier revision 沿用旧版状态)',via:'typed'});
    it.photos=[];it.audios=[];it.note='';it.status='';it.src='';it.evDate='';
    mark('items',it,it.key);
  });
  if(changed){assignNumbers(c);c.entries.forEach(function(e){mark('entries',e,e.id)})}
  return changed;
}
function migrateOld(){
  var raw=null;try{raw=localStorage.getItem(OLDKEY)}catch(e){}
  var lang=null;try{lang=localStorage.getItem('as_lang')}catch(e){}
  if(lang&&(lang==='en-US'||lang==='zh-CN')){S.lang=lang;setMeta('lang',lang)}
  if(lang){try{localStorage.removeItem('as_lang')}catch(e){}}
  if(!raw)return noop();
  var old;try{old=JSON.parse(raw)}catch(e){return noop()}
  if(!old||!old.cases||!old.cases.length){try{localStorage.removeItem(OLDKEY)}catch(e){}return noop()}
  var n=0,migrated=[];
  old.cases.forEach(function(oc){
    if(caseById(oc.id))return;
    var c={id:oc.id||uid(),client:oc.client||'(migrated)',date:oc.date||today(),auditor:oc.auditor||'',created:oc.created||new Date().toISOString(),capState:'finished',capMs:0,items:{},entries:[]};
    Object.keys(oc.items||{}).forEach(function(k){
      var o=oc.items[k],it=blankItem(c,k);
      ['status','src','sample','evDate','note','stmt','sev'].forEach(function(f){it[f]=o[f]||''});
      it.photos=[];it.audios=[];
      (o.photos||[]).forEach(function(p){
        if(!p||!p.t)return;
        try{var b=dataUrlToBlob(p.t),id='b'+uid();B[id]={id:id,caseId:c.id,kind:'photo',mime:b.type,blob:b,ts:p.ts||''};
          it.photos.push({id:id,ts:p.ts||'',mime:b.type,size:b.size})}catch(e){}
      });
      c.items[k]=it;
    });
    convertLegacy(c);dirty={};
    loadedBlobs[c.id]=true;db.cases.push(c);migrated.push(c);n++;
  });
  return Promise.all(migrated.map(function(c){return persistFullCase(c)})).then(function(){
    return tx(['cases'],'readonly',function(s){return s.count()});
  }).then(function(r){
    if(r.result>=db.cases.length){try{localStorage.removeItem(OLDKEY)}catch(e){}if(n)toast('Migrated '+n+' case(s) from rev01 已迁移 '+n+' 个案卷')}
  }).catch(function(e){fatal(e,'migrate')});
}
function migrateRev02(){
  var n=0;
  db.cases.forEach(function(c){if(convertLegacy(c))n++});
  if(n){toast('Upgraded '+n+' case(s) from rev02 into the timeline 已把 '+n+' 个旧案卷升级为时间线');return flush()}
  return noop();
}

/* ---------- persistence request + banners ---------- */
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)}
function askPersist(){
  if(!(navigator.storage&&navigator.storage.persist)){persistState='unsupported';return noop()}
  return navigator.storage.persist().then(function(ok){persistState=ok?'granted':'denied'},function(){persistState='unsupported'}).then(function(){render()});
}
function storageBanner(){
  var h='';
  if(memOnly)h+='<div class="banner red"><b>Storage unavailable 存储不可用.</b> This browser blocked IndexedDB (private mode?). Data will be lost when you close the page — export a backup before leaving. 此浏览器禁用了本地数据库（隐私模式？），关闭页面数据会丢失，请先导出备份。</div>';
  if(!isStandalone())h+='<div class="banner"><b>Tip 提示 — Add to Home Screen 添加到主屏幕:</b> in Safari tap <b>Share ⬆︎ → Add to Home Screen</b>. The installed app keeps its data far more reliably than a Safari tab. 在 Safari 点“分享 ⬆︎ → 添加到主屏幕”，主屏幕版本比普通标签页更不容易被清理数据。</div>';
  var ps=persistState==='granted'?'granted ✓ 已授予':persistState==='denied'?'not granted 未授予 (add to Home Screen 请添加到主屏幕)':persistState==='unsupported'?'not supported 不支持':'…';
  h+='<div class="fine" id="stor">Persistent storage 持久存储: '+ps+'</div>';
  return h;
}
function nagState(){
  if(!db.cases.length)return null;
  var ref=S.lastBackup||0;
  if(!ref){db.cases.forEach(function(c){var t=Date.parse(c.created)||Date.now();if(!ref||t<ref)ref=t})}
  var late=(Date.now()-ref)>NAG_MS;
  return{late:late,never:!S.lastBackup,days:Math.floor((Date.now()-ref)/86400000)};
}
function backupBanner(){
  var n=nagState();if(!n)return '';
  var last=S.lastBackup?fmt(S.lastBackup):'never 从未';
  if(n.late)return '<div class="banner red" id="nag"><b>Back up now 请立即备份:</b> '+(n.never?'no backup has been made and your oldest case is over 3 days old.':'last backup was '+n.days+' days ago.')+' 距上次备份已超过 3 天。<div class="row" style="margin-top:8px"><button class="btn sm pri" data-act="backupall">Backup all 备份全部</button></div><div class="fine">Last backed up 上次备份: '+last+'</div></div>';
  return '<div class="fine" id="lastbk">Last backed up 上次备份: '+last+'</div>';
}

/* ---------- summary / composition ---------- */
function stLabel(s){return({seen:'Seen 看到',not:'Not seen 未看到',na:'N/A 不适用'})[s]||'(no status 未标状态)'}
function groupOf(c,p){return c.entries.filter(function(e){return e.tag===p.id})}
function untagged(c){return c.entries.filter(function(e){return !itemOf(e.tag)})}
function clauseStatus(es){
  if(!es.length)return 'none';
  var s=es.map(function(e){return e.status});
  if(s.indexOf('not')>-1)return 'not';if(s.indexOf('seen')>-1)return 'seen';if(s.indexOf('na')>-1)return 'na';return 'open';
}
function needFinding(es){var s=clauseStatus(es);return s==='not'||s==='none'||s==='open'}
function csLabel(s){return({seen:'Seen 看到',not:'Not seen 未看到',na:'N/A 不适用',open:'Tagged, no status 已归类未标状态',none:'No entries 无条目'})[s]}
function entLine(e){
  var t='#'+e.n+' ['+fmt(e.ts).slice(11)+'] '+kindEn(e)+(e.status?' · '+stLabel(e.status):'');
  if(e.kind==='photo')t+=' — '+fileName(e);
  else if(e.kind==='audio')t+=' ('+mmss(e.dur)+') — '+fileName(e);
  else t+=': '+e.text;
  if(e.kind!=='text'&&e.note)t+='\n    note: '+e.note;
  return t;
}
function evText(es){return es.length?es.map(entLine).join('\n'):'(no entries 无条目)'}
function summaryHead(c){
  return 'AS · Auditing Secretary — DRAFT case summary\nClause: '+CLAUSE+'\nClient: '+c.client+'\nAudit date: '+c.date+(c.auditor?'\nAuditor: '+c.auditor:'')+'\nEntries: '+c.entries.length+' · capture time '+clock(c.capMs)+'\nGenerated: '+fmt(Date.now())+' (device time)\n'+
   'Note: draft prepared from auditor field notes; findings and severity are the auditor’s decision.\n\n';
}
function composeText(c){
  var t=summaryHead(c);
  ITEMS.forEach(function(p,i){
    var es=groupOf(c,p),it=item(c,p.id);
    t+='== 8.4.1 · '+(i+1)+'. '+p.a+' / '+p.az+' ==\nRequirement: '+p.req+'\nEvidence ('+csLabel(clauseStatus(es))+'):\n'+evText(es).replace(/^/gm,'  ')+'\n'+(it.sample?'Sample: '+it.sample+'\n':'');
    if(needFinding(es))t+='Finding draft:\n  1. Evidence: (see above)\n  2. Requirement: (see above)\n  3. Statement of nonconformity: '+(it.stmt||'[auditor to complete]')+'\n  Severity: '+(it.sev||'[auditor to complete]')+'\n';
    t+='\n';
  });
  var u=untagged(c);
  t+='== Untagged 未归类 ('+u.length+') ==\n'+evText(u).replace(/^/gm,'  ')+'\n';
  return t;
}
function composeCompact(c){
  var t=summaryHead(c);
  ITEMS.forEach(function(p,i){
    var es=groupOf(c,p),it=item(c,p.id);
    t+=(i+1)+'. '+p.a+' — '+csLabel(clauseStatus(es))+' | entries '+es.length+'\n';
    es.forEach(function(e){if(e.kind==='text')t+='   #'+e.n+' '+e.text+'\n'});
    if(needFinding(es)&&(it.stmt||it.sev))t+='   Statement: '+(it.stmt||'[auditor]')+' | Severity: '+(it.sev||'[auditor]')+'\n';
  });
  var u=untagged(c);
  t+='Untagged: '+u.length+'\n';u.forEach(function(e){if(e.kind==='text')t+='   #'+e.n+' '+e.text+'\n'});
  return t;
}
function composeHTML(c){
  var jobs=[];
  c.entries.forEach(function(e){if(e.kind==='photo'&&B[e.id])jobs.push(blobToDataUrl(B[e.id].blob).then(function(u){e._u=u}))});
  return Promise.all(jobs).then(function(){
    function blk(es){return es.length?es.map(function(e){var s='<p>'+esc(entLine(e)).replace(/\n/g,'<br>')+'</p>';if(e._u)s+='<img src="'+e._u+'" width="160">';return s}).join(''):'<p>(no entries)</p>'}
    var b='<h1>AS · Auditing Secretary — DRAFT case summary</h1><p>Clause '+CLAUSE+'<br>Client: '+esc(c.client)+'<br>Audit date: '+esc(c.date)+(c.auditor?'<br>Auditor: '+esc(c.auditor):'')+'<br>Entries: '+c.entries.length+'<br>Generated: '+esc(fmt(Date.now()))+' (device time)</p><p><i>Draft from auditor field notes; findings and severity are the auditor’s decision.</i></p>';
    ITEMS.forEach(function(p,i){
      var es=groupOf(c,p),it=item(c,p.id);
      b+='<h2>'+(i+1)+'. '+esc(p.a)+' / '+esc(p.az)+'</h2><p><b>Requirement:</b> '+esc(p.req)+'</p><p><b>Evidence — '+esc(csLabel(clauseStatus(es)))+':</b></p>'+blk(es);
      if(needFinding(es))b+='<p><b>Finding draft:</b><br>1 Evidence: see above<br>2 Requirement: see above<br>3 Statement of nonconformity: '+(esc(it.stmt)||'[auditor to complete]')+'<br>Severity: '+(esc(it.sev)||'[auditor to complete]')+'</p>';
    });
    b+='<h2>Untagged</h2>'+blk(untagged(c));
    c.entries.forEach(function(e){delete e._u});
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case summary</title><style>body{font:15px/1.5 sans-serif;max-width:760px;margin:20px auto;padding:0 12px}</style></head><body>'+b+'</body></html>';
  });
}

    var mime=pickMime(),mr;
    try{mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}
    catch(e){stream.getTracks().forEach(function(t){t.stop()});toast('Cannot start recording 无法开始录音');return}
    R={caseId:c.id,mr:mr,stream:stream,chunks:[],t0:Date.now(),mime:mr.mimeType||mime||'audio/mp4',discard:false};
    var me=R;
    mr.ondataavailable=function(e){if(e.data&&e.data.size)me.chunks.push(e.data)};
    mr.onstop=function(){finishRec(me)};
    mr.onerror=function(){me.discard=false;finishRec(me)};
    try{mr.start(1000)}catch(e){mr.start()}
    me.timer=setInterval(function(){
      var s=(Date.now()-me.t0)/1000,el=$('#rt');if(el)el.textContent=mmss(s);
      if(s>=600){stopRec(true);toast('10 min limit reached 已达 10 分钟上限')}
    },500);

}

function finishRec(r){
  if(!r||r.done)return;r.done=true;clearInterval(r.timer);
  try{r.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}
  if(R===r)R=null;

  }else render();

  S.cur=id;setMeta('cur',id);openE={};filt='all';

  loadBlobs(id).then(function(){goto('case',c&&c.capState==='finished'?'review':'capture')},function(e){fatal(e,'blobs');goto('case','capture')});
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT'||b.tagName==='TEXTAREA')return;
  if(b.disabled)return;
  var a=b.dataset.act,id=b.dataset.id,c=cur();
  if(a==='newcase'){
    var cl=$('#nc').value.trim();if(!cl){toast('Enter a client name 请输入客户名');return}
    var n={id:uid(),client:cl,date:$('#nd').value||today(),auditor:$('#na').value.trim(),items:{},entries:[],capState:'active',capMs:0,created:new Date().toISOString()};
    db.cases.push(n);loadedBlobs[n.id]=true;putCase(n).then(function(){openCase(n.id)});
  }
  else if(a==='demo')loadDemo();
  else if(a==='opencase')openCase(id);
  else if(a==='home'){if(R)stopRec(true);flush();if(c)putCase(c);goto('home')}
  else if(a==='tab'){goto('case',b.dataset.t)}
  else if(a==='filt'){filt=b.dataset.f;render()}
  else if(a==='lang'){setMeta('lang',b.dataset.l);if(voice&&voice.rec){stopDictation()}var t=$('#tt'),v=t?t.value:'';if($('#overlay').innerHTML){textSheet();var t2=$('#tt');if(t2)t2.value=v}else render()}
  /* capture controls */
  else if(a==='photo'){if(c.capState==='active'&&!R)consentSheet('photo')}
  else if(a==='consentok'){closeSheet();if(b.dataset.k==='audio'){audioConsent=true;doStartRec()}else $('#photoIn').click()}
  else if(a==='consentlib'){closeSheet();$('#libIn').click()}
  else if(a==='consentno')closeSheet();
  else if(a==='rec')startRec();
  else if(a==='recstop')stopRec(true);
  else if(a==='text'){if(c.capState==='active'&&!R)textSheet()}
  else if(a==='dict')startDictation();
  else if(a==='dictstop'){if(voice&&voice.rec)try{voice.rec.stop()}catch(e){}}
  else if(a==='textsave'){
    var el=$('#tt'),txt=(el?el.value:'').trim(),used=!!(voice&&voice.used);
    stopDictation();
    if(!txt){toast('Nothing to save 没有内容');return}
    closeSheet();
    addEntry(c,'text',{text:txt,via:used?'dictated':'typed'}).then(function(en){if(en)toast('Saved 已保存 → #'+en.n);render()});
  }
  else if(a==='textcancel'){stopDictation();closeSheet()}
  else if(a==='hold'){if(R)stopRec(true);setCap(c,'held');render()}
  else if(a==='resume'){setCap(c,'active');render()}
  else if(a==='finish'){
    var go=function(){setCap(c,'finished');flush();goto('case','review')};
    if(R)stopRec(true);go();
  }
  /* review */
  else if(a==='etoggle'){openE[id]=!openE[id];render()}
  else if(a==='status'){var en2=entById(c,id);en2.status=(en2.status===b.dataset.s)?'':b.dataset.s;markEnt(en2);render()}
  else if(a==='edel'){
    if(confirm('Delete this entry? 删除此条目？')){
      var en3=entById(c,id);c.entries.splice(c.entries.indexOf(en3),1);
      delete B[id];if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}
      if(idb)tx(['blobs','entries'],'readwrite',function(bs,es){bs.delete(id);es.delete(id)}).catch(function(err){fatal(err,'del')});
      render();
    }
  }
  /* summary / export */
  else if(a==='sendmail')sendMail();
  else if(a==='copy'){copyText(composeText(c))}
  else if(a==='dltxt'){download(fname(c,'txt'),'text/plain;charset=utf-8',composeText(c))}
  else if(a==='dlhtml'){composeHTML(c).then(function(h){download(fname(c,'html'),'text/html;charset=utf-8',h)})}
  else if(a==='dlmedia')downloadMedia(c);
  else if(a==='closesheet')closeSheet();
  else if(a==='dljson'){flush().then(function(){return doBackup([c],fname(c,'json').replace(/\.json$/,'-backup.json'))})}
  else if(a==='backupall'){flush().then(function(){return doBackup(db.cases,'AS-backup-all-'+today()+'.json')})}
  else if(a==='import')$('#impIn').click();
  else if(a==='delcase'){
    if(confirm('Delete this case file and all its entries, photos and recordings from this device? This cannot be undone.\n删除此案卷及全部条目、照片和录音？无法恢复。')){
      var did=c.id;
      Object.keys(B).forEach(function(k){if(B[k].caseId===did){if(urls[k]){URL.revokeObjectURL(urls[k]);delete urls[k]}delete B[k]}});
      db.cases=db.cases.filter(function(x){return x.id!==did});S.cur=null;setMeta('cur',null);
      delCaseDb(did).then(function(){toast('Deleted 已删除')},function(e){fatal(e,'delete')});
      goto('home');
    }
  }
});
document.addEventListener('input',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='email'){clearTimeout(input.te);input.te=setTimeout(function(){setMeta('email',t.value.trim())},300);return}
  var c=cur();if(!c)return;
  if(a==='etext'||a==='enote'){var en=entById(c,t.dataset.id);if(!en)return;if(a==='etext')en.text=t.value;else en.note=t.value;markEnt(en)}
  else if(a==='smp'){item(c,t.dataset.id).sample=t.value;markItem(c,t.dataset.id)}
  else if(a==='stmt'){item(c,t.dataset.id).stmt=t.value;markItem(c,t.dataset.id)}
});
function input(){}
document.addEventListener('change',function(e){
  var t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  var c=cur();if(!c&&a!=='email')return;
  if(a==='tag'){var en=entById(c,t.dataset.id);en.tag=t.value;markEnt(en);render()}
  else if(a==='sev'){item(c,t.dataset.id).sev=t.value;markItem(c,t.dataset.id)}
  else if(a==='email')setMeta('email',t.value.trim());
});

/* ---------- demo ---------- */
function demoPhoto(){return new Promise(function(res){
  var cv=document.createElement('canvas');cv.width=800;cv.height=560;var x=cv.getContext('2d');
  x.fillStyle='#f4f1e8';x.fillRect(0,0,800,560);x.fillStyle='#222';x.font='bold 34px sans-serif';x.fillText('DEMO — Approved Supplier List',40,70);
  x.font='24px sans-serif';['Rev 7 · Owner: QA Manager','1. ACME Metals (material)','2. DEMO Plating Ltd (outsourced process)','3. Sample Fasteners Co.','(demo image, not real data)'].forEach(function(l,i){x.fillText(l,40,140+i*56)});
  cv.toBlob(function(b){res(b)},'image/jpeg',0.7);
})}
function loadDemo(){
  var n={id:uid(),client:'DEMO Co. (demo data 演示)',date:today(),auditor:'F2 demo',created:new Date().toISOString(),items:{},entries:[],capState:'finished',capMs:754000};
  var t0=Date.now()-30*60000,k=0;
  function txt(text,tag,status,via){n.entries.push({id:'t'+uid(),caseId:n.id,n:++k,kind:'text',ts:new Date(t0+k*4*60000).toISOString(),text:text,note:'',via:via||'typed',mime:'',size:0,tag:tag||'',status:status||''})}
  txt('Approved supplier list rev 7, owner QA manager.','list','seen');
  var photoSlot=k+1;k++;   // entry #2 is the photo
  txt('Procedure SP-04 states criteria; two files checked.','crit','seen');
  txt('Said re-evaluation is done yearly; no records shown yet.','rec','not','dictated');
  txt('Q3 scorecard: on-time delivery and defect rate tracked.','mon','seen');
  txt('Goods-in area: pallets labelled by supplier.','','');
  demoPhoto().then(function(b){
    var id='b'+uid();B[id]={id:id,caseId:n.id,kind:'photo',mime:'image/jpeg',blob:b,ts:new Date(t0+photoSlot*4*60000).toISOString()};
    n.entries.push({id:id,caseId:n.id,n:photoSlot,kind:'photo',ts:B[id].ts,text:'',note:'Supplier list page 1, rev 7',via:'',mime:'image/jpeg',size:b.size,w:800,h:560,tag:'list',status:'seen'});
    sortEntries(n);loadedBlobs[n.id]=true;db.cases.push(n);
    return persistFullCase(n);
  }).then(function(){S.cur=n.id;setMeta('cur',n.id);openE={};filt='all';goto('case','review')},function(e){fatal(e,'demo')});
}

openDB().then(function(d){idb=d;idb.onversionchange=function(){idb.close();idb=null}}).catch(function(e){memOnly=true;console.warn('IndexedDB unavailable',e)})
.then(function(){return idb?loadAll():noop()})
.then(function(){return idb?migrateOld():noop()})
.then(function(){return idb?migrateRev02():noop()})
.then(function(){
  if(S.cur&&!caseById(S.cur))S.cur=null;
  render();askPersist();
  window.__asReady=true;
}).catch(function(e){console.warn(e);render();window.__asReady=true});
})();
