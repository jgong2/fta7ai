  var side='<aside class="side" aria-label="'+t('Questions','题目')+'"><div class="sh1"><div class="logo sm">'+ic('logo',20)+'</div><b>FTA · KB 知识库采集</b></div>'+
    '<button class="nk'+(r[0]?'':' on')+'" data-act="open" data-to=""><span>'+t('Overview','总览')+'</span><span class="cnt" id="dkTot">'+an+'/'+tot+'</span></button>'+
    '<div class="nav" id="dkNav">'+nav+'</div>'+
    '<div class="sfoot"><button class="btn pri" data-act="submit" id="dkSub">'+ic('send',18)+'<span>'+t('Submit to '+S.to,'提交给 '+S.to)+'</span>'+(un?'<i class="dot">'+un+'</i>':'')+'</button>'+
    '<div class="srow"><button class="ib who" data-act="acct">'+ic('user',18)+'<span>'+esc(S.user||'')+'</span></button><button class="ib so" data-act="logout" id="dkOut">'+ic('out',18)+'<span>'+t('Switch / Leave','换人 / 退出')+'</span></button></div></div></aside>';
  var bk=o.back?'<button class="ib bk" data-act="back" aria-label="'+t('Back','返回')+'">'+ic('back')+'<span>'+t('Back','返回')+'</span></button>':'<span></span>';
  var keys=r[0]==='item'?'<p class="fine kh">'+t('Keyboard: A–E or 1–5 picks an answer · ← → previous / next','键盘：A–E 或 1–5 选答案 · ← → 上一题 / 下一题')+'</p>':'';
  return '<div class="dkw">'+side+'<div class="dmain"><header class="top">'+bk+'<div class="tt">'+esc(o.title||'')+'</div><div class="tr">'+(o.right||'')+'</div></header><main class="mn">'+(o.banner||'')+o.body+keys+'</main>'+(o.foot?'<footer class="bar">'+o.foot+'</footer>':'')+'</div></div>'
};
var _renderPhone=render;
render=function(keep){var n=$('#dkNav'),st=n?n.scrollTop:0;_renderPhone(keep);var m=$('#dkNav');if(m){m.scrollTop=st;var a=$('.nv.on',m);if(a){var ar=a.getBoundingClientRect(),mr=m.getBoundingClientRect();if(ar.top<mr.top||ar.bottom>mr.bottom)a.scrollIntoView({block:'center'})}}};
function dkSync(){var nav=$('#dkNav');if(!nav)return;
  $$('.nv',nav).forEach(function(b){var id=b.getAttribute('data-id'),d=done(id),rr=R(id),st=$('.st',b);
    if(d&&!st.classList.contains('ok')){st.classList.add('ok');st.innerHTML=ic('check',14)}
    var ud=$('.ud',b);if(rr&&rr.unsent&&!ud)b.insertAdjacentHTML('beforeend','<i class="ud"></i>');else if(!(rr&&rr.unsent)&&ud)ud.remove()});
  S.pack.modules.forEach(function(m){['KB1','KB2'].forEach(function(kb){var c=counts(listFor(m.id,kb)),e=$('.cnt[data-k='+kb+']',nav);if(e){e.textContent=c.done+'/'+c.total;e.classList.toggle('full',c.done===c.total)}})});
  var tt=$('#dkTot');if(tt)tt.textContent=answeredCount()+'/'+items().length;
  var sb=$('#dkSub'),un=unsentCount();if(sb){var dt=$('.dot',sb);if(un){if(!dt)sb.insertAdjacentHTML('beforeend','<i class="dot"></i>');$('.dot',sb).textContent=un}else if(dt)dt.remove()}}
var _saveNowPhone=saveNow;
saveNow=function(extra){return _saveNowPhone(extra).then(function(x){try{dkSync()}catch(e){}return x})};
document.addEventListener('keydown',function(ev){
  if(S.role==='owner'||!S.tok||$('#sheet').classList.contains('on'))return;var tg=ev.target&&ev.target.tagName;if(tg==='TEXTAREA'||tg==='INPUT'&&ev.target.type!=='radio'||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  var r=route();if(r[0]!=='item')return;var k=ev.key;
  if(k==='ArrowRight'){ev.preventDefault();step(1);return}if(k==='ArrowLeft'){ev.preventDefault();var it=itemById(CUR.id),l=listFor(it.module,it.kb);if(l.indexOf(it)>0)step(-1);return}
  var ix='abcde'.indexOf(k.toLowerCase());if(ix<0)ix='12345'.indexOf(k);if(ix<0)return;
  var ins=$$('.opt input');if(ins[ix]){ev.preventDefault();ins[ix].checked=true;pickChoice(ins[ix].value)}
});
/* ===== render, events, boot ===== */
var LASTV='';
function render(keep){
  var app=$('#app'),r=route(),h='',pos=window.scrollY;
  if(!S.tok||!S.user||!S.pack){app.innerHTML=vStart();var f=$('#lu');if(f)f.addEventListener('keydown',function(e){if(e.key==='Enter')doStart(e)});return}
  var name=r[0]||'';
  if(S.role==='owner'){
    if(name==='desk'&&r[1]==='user'&&r[2]){
      var id=KB.normUser(r[2]);if(!D.user||D.user.user.id!==id){D.user=null;api('GET','/v1/admin/user?id='+id).then(function(x){if(x.ok){D.user=x.j;render(true)}else{D.err=errMsg(x.j);go('desk')}})}
      h=vDUser(id)
    }else{if(name!=='desk'){go('desk');return}h=vDesk()}
  }else{
    if(name==='list'&&r[1]&&r[2])h=vList(r[1],r[2]);else if(name==='item'&&r[1])h=vItem(r[1]);else h=vHome();
  }
  app.innerHTML=h;
  if(!keep)window.scrollTo(0,0);else window.scrollTo(0,pos);
  if(S.role==='owner'){if(name==='desk'&&r[1]==='user')afterDUser();else loadDesk()}
  else if(name==='item'&&r[1]&&CUR.id!==r[1])afterItem(r[1]);
  else if(name==='item'&&r[1]){renderMediaMaybe()}
}
function renderMediaMaybe(){var it=itemById(CUR.id);if(it&&it.kb==='KB2')renderMedia()}

document.addEventListener('click',function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
  if(a==='back'){var r=route();if(r[0]==='item')step(0);else if(r[0]==='desk')go('desk');else go('');return}
  if(a==='open'){var to=el.getAttribute('data-to');flush().then(function(){go(to)});return}
  if(a==='next')return step(1);if(a==='prev')return step(-1);
  if(a==='submit')return openSubmit();if(a==='send')return doSend();if(a==='close')return closeSheet();
  if(a==='start')return doStart(ev);if(a==='acct')return openAcct();if(a==='about'){closeSheet();return openAbout()}
  if(a==='logout')return S.role==='owner'?(closeSheet(),logout()):askLogout();if(a==='logoutGo'){closeSheet();return logout()}if(a==='sendOut'){var sb=$('#sb');if(sb)sb.disabled=true;return doSend(true)}
  if(a==='lang'){S.lang=el.getAttribute('data-v');cfgSave();document.documentElement.lang=S.lang;if($('#sheet').classList.contains('on'))closeSheet();render(true);return}
  if(a==='snd'){S.sound=!S.sound;cfgSave();el.querySelector('.sw').classList.toggle('on',S.sound);clickFx();return}
  if(a==='micStart')return micStart();if(a==='micStop')return micStop();
  if(a==='photoPick'){$('#photoIn').value='';$('#photoIn').click();return}
  if(a==='mdel')return mediaDelete(el.getAttribute('data-t'));
  if(a==='dtab'){D.tab=el.getAttribute('data-v');D.err='';render(true);return}
  if(a==='dfilter'){D.filter=el.getAttribute('data-v');render(true);return}
  if(a==='export')return doExport(el.getAttribute('data-v'));
  if(a==='score'){var rv=el.closest('.rv');$$('.seg button',rv).forEach(function(b){b.classList.toggle('on',b===el)});clickFx();return}
  if(a==='rsave'){var rv2=el.closest('.rv'),on=$('.seg button.on',rv2);if(!on){toast(t('Pick Weak, OK or Strong first.','先选 弱 / 可 / 强。'));return}
    api('PUT','/v1/admin/review',{body:{user:D.user.user.id,item:rv2.getAttribute('data-i'),score:parseInt(on.getAttribute('data-s'),10),comment:$('.rc2',rv2).value}}).then(function(x){toast(x.ok?t('Review saved','评分已保存'):errMsg(x.j))});return}
    if(a==='ddis'){var u=D.user.user,dis=!u.disabled;api('POST','/v1/admin/disable',{body:{user:u.id,disabled:dis}}).then(function(x){if(x.ok){u.disabled=dis;D.users=null;toast(dis?t('Disabled','已停用'):t('Enabled','已启用'));render(true)}else toast(errMsg(x.j))});return}
});
document.addEventListener('change',function(ev){var e=ev.target;if(e.matches&&e.matches('input[data-in=choice]'))pickChoice(e.value);if(e.id==='photoIn')photoPicked(e.files&&e.files[0])});
document.addEventListener('input',function(ev){if(ev.target.matches&&ev.target.matches('textarea[data-in=text]'))typed()});
document.addEventListener('focusout',function(ev){if(ev.target.matches&&ev.target.matches('textarea[data-in=text]')&&CUR.timer)flush()});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeSheet()});
window.addEventListener('hashchange',function(){render()});
window.addEventListener('beforeunload',function(){if(CUR.timer)flush()});

(function boot(){
  cfgLoad();document.documentElement.lang=S.lang;S.tok=tokLoad();
  idbOpen().then(function(){
    if(!S.tok){render();return}
    loadAll().then(function(m){if(!m||m.ok===false){S.tok='';tokSave()}render()})
